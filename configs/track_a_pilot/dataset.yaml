# Track-A pilot dataset (clsm.config.DatasetConfig schema).
# Decision: DECISION_LOG D-041. Frozen BEFORE any Track-A scientific outcome was seen.
# Item selection is deterministic (sha256_sorted_first_n); NO generator run informed it.
#
# WHY MMLU (not GPQA-Diamond) for Track A:
#   - maximal comparability: Chen et al. (arXiv:2505.05410) and Young et al. 2026 use
#     MMLU for exactly this hidden-influence / thinking-vs-answer paradigm; Track B
#     (configs/milestone1/dataset.yaml) pins this same dataset+revision (D-011/D-019).
#   - eligibility feasibility on the LOCKED small model: switch-eligibility requires
#     a_u == correct. Qwen3-1.7B (thinking) scores MMLU-Redux 73.9 vs GPQA-Diamond 40.1
#     (Qwen3 Technical Report arXiv:2505.09388, Tables 19-20). On a 4-way MCQ, 40.1 is
#     ~15pp above chance -> a small, noisy eligible set on GPQA; ~74% on MMLU -> a large
#     eligible set. Dataset chosen for measurability of the research question on the
#     locked model, NOT to shop for an effect.
#   - MIT license, no access gating, loadable as metadata.
# GPQA-Diamond stays as a DEFERRED robustness secondary (PILOT_PROTOCOL.md §17), same as
# Track B. Its Urdu translation + native correction is a Milestone-3+ dependency.

id: cais/mmlu
config_name: all
split: test
# Track B's HF-refs-API-verified pin (D-019), inherited on the evidence above. Same
# revision => Track A and Track B consume byte-identical items.
revision: "c30699e8356da336a370243923dbaf21066bb9fe"
license: MIT   # github.com/hendrycks/test LICENSE; cite Hendrycks et al. 2021

# 10 subjects x 5 items = 50. IDENTICAL stratified list to Track B (STEM / humanities /
# social science) so the math-leaning model is not tested only where weak, and so the
# two tracks' pilots are directly comparable. Frozen before data; cannot bias the gap.
subjects:
  - high_school_mathematics
  - college_computer_science
  - college_physics
  - high_school_chemistry
  - high_school_biology
  - formal_logic
  - philosophy
  - moral_scenarios
  - us_foreign_policy
  - econometrics
items_per_subject: 5
max_chars: 1500
selection_rule: sha256_sorted_first_n

# 'hf_datasets' downloads MMLU on first use -- only after run authorization. NOT
# downloaded during protocol design. Tests use tests/fixtures/mmlu_mini.jsonl instead.
source: hf_datasets
local_path: null

provenance_tag: >-
  DECISION_LOG D-041 ; MMLU pin inherited from Track B D-011/D-019 (HF refs API verified
  2026-09-01) ; eligibility evidence from Qwen3 Technical Report arXiv:2505.09388
  Tables 19-20 ; contamination is a documented threat (PILOT_PROTOCOL.md §3, §17)
