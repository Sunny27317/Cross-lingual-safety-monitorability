# Milestone-1 dataset: MMLU (primary). Decisions: DECISION_LOG.md D-011; readiness §5.
# GPQA-Diamond is the SECONDARY / robustness dataset and is NOT configured here — it
# enters only at the confirmatory stage.
#
# n = 50 = PIPELINE VALIDATION ONLY. It must never be reported as a confirmatory result.

id: cais/mmlu
config_name: all
split: test
# Pinned to branch `main` HEAD, verified via the HF refs API 2026-09-01 (metadata only;
# no dataset content downloaded). Last modified upstream 2024-03-08 — stable. D-019.
# Parquet auto-convert branch (used if datasets loads via parquet): d183e18c31b6d5563d00fb87257819c64e76b985
revision: "c30699e8356da336a370243923dbaf21066bb9fe"
license: MIT   # upstream github.com/hendrycks/test/blob/master/LICENSE; cite Hendrycks et al. 2021 (ICLR x2)

# 10 subjects x 5 items = 50. Fixed list spanning STEM / humanities / social science so
# the math-specialised distill is not evaluated only where it is weakest (readiness §10).
subjects:
  - high_school_mathematics
  - college_computer_science
  - college_physics
  - high_school_chemistry
  - high_school_biology
  - formal_logic
  - philosophy
  - moral_scenarios
  - us_foreign_policy
  - econometrics
items_per_subject: 5
max_chars: 1500             # question + choices character cap (readiness §5)
selection_rule: sha256_sorted_first_n

# 'hf_datasets' downloads MMLU on first use — that only happens after run authorization.
# Tests do NOT use this file's source; they build a DatasetConfig pointing at
# tests/fixtures/mmlu_mini.jsonl via model_copy (see tests/conftest.py).
source: hf_datasets
local_path: null

provenance_tag: "readiness §5; Chen et al. dataset; MIT-licensed; contamination = documented threat"
